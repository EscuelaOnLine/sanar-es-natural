<!DOCTYPE html> <html lang="es" class="h-full bg-[#f8f7f5]"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Emisión de Invitación Oficial • Sanar es Natural</title> <script src="https://cdn.tailwindcss.com"></script> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"> <script> tailwind.config = { theme: { extend: { fontFamily: { serif: ['"Playfair Display"', 'Georgia', 'serif'], sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'], }, colors: { brand: { 50: '#f2f7f4', 100: '#e1ede6', 600: '#234e3b', 700: '#1c3e2f', 800: '#163125', 900: '#0f2219', } } } } } </script> </head> <body class="min-h-full bg-[#f8f7f5] text-stone-800 font-sans antialiased flex flex-col justify-between p-4 sm:p-6 lg:p-8"> <div></div> <!-- CAJA PRINCIPAL DE EMISIÓN DE INVITACIÓN --> <main class="max-w-xl w-full mx-auto my-auto bg-white border border-stone-200/90 rounded-3xl shadow-xl p-6 sm:p-10 space-y-8"> <!-- CABECERA --> <div class="flex items-center justify-between pb-6 border-b border-stone-100"> <div class="flex items-center gap-4"> <a href="direccion.html" title="Volver al Despacho"> <img src="/logo.svg" alt="Logo Sanar es Natural" class="w-11 h-11 object-contain drop-shadow-sm hover:scale-105 transition-transform"> </a> <div class="space-y-0.5"> <span class="text-[10px] uppercase tracking-[0.2em] font-bold text-stone-400 block">DESPACHO DE DIRECCIÓN</span> <h1 class="font-serif font-bold text-2xl text-stone-900 leading-tight">Referencia Persona a Persona</h1> <p class="text-xs text-stone-500">Emisión Oficial de Boleto para Aspirante en Línea</p> </div> </div> <a href="direccion.html" class="px-3 py-1.5 rounded-full border border-stone-200 text-stone-500 hover:text-stone-800 hover:bg-stone-50 text-xs font-medium transition-colors" title="Volver al Despacho"> ✕ </a> </div> <!-- FORMULARIO CON REDIRECCIÓN ASEGURADA --> <form id="formEmision" onsubmit="event.preventDefault(); emitirInvitacionAsegurada();" class="space-y-5"> <!-- Nombre Completo --> <div class="space-y-1.5"> <label for="inpNombre" class="block text-xs font-bold uppercase tracking-wider text-stone-600">Nombre Completo del Aspirante</label> <input type="text" id="inpNombre" required placeholder="Ej: Roberto Morales" class="w-full px-4 py-3 rounded-xl border border-stone-300 focus:border-brand-700 focus:ring-2 focus:ring-brand-100 outline-none text-sm text-stone-800 transition-all"> </div> <!-- Cédula y Teléfono en 2 Columnas --> <div class="grid grid-cols-1 sm:grid-cols-2 gap-4"> <div class="space-y-1.5"> <label for="inpCedula" class="block text-xs font-bold uppercase tracking-wider text-stone-600">Cédula / Documento</label> <input type="text" id="inpCedula" required placeholder="Ej: V-14.829.102" class="w-full px-4 py-3 rounded-xl border border-stone-300 focus:border-brand-700 focus:ring-2 focus:ring-brand-100 outline-none text-sm text-stone-800 transition-all"> </div> <div class="space-y-1.5"> <label for="inpTelefono" class="block text-xs font-bold uppercase tracking-wider text-stone-600">Teléfono (con WhatsApp)</label> <input type="tel" id="inpTelefono" required placeholder="Ej: +58 412 1234567" class="w-full px-4 py-3 rounded-xl border border-stone-300 focus:border-brand-700 focus:ring-2 focus:ring-brand-100 outline-none text-sm text-stone-800 transition-all"> </div> </div> <!-- Correo Electrónico --> <div class="space-y-1.5"> <label for="inpCorreo" class="block text-xs font-bold uppercase tracking-wider text-stone-600">Correo Electrónico</label> <input type="email" id="inpCorreo" required placeholder="ejemplo@correo.com" class="w-full px-4 py-3 rounded-xl border border-stone-300 focus:border-brand-700 focus:ring-2 focus:ring-brand-100 outline-none text-sm text-stone-800 transition-all"> </div> <!-- Nota de 72 Horas --> <div class="p-3 bg-amber-50/70 border border-amber-200/80 rounded-xl text-amber-900 text-xs flex items-center gap-2.5"> <span class="text-base">⏳</span> <span>El boleto generado tendrá una validez estricta de <strong>72 horas</strong> a partir de su emisión.</span> </div> <!-- BOTÓN PRINCIPAL --> <div class="pt-2"> <button type="submit" id="btnSubmitEmitir" class="w-full py-3.5 px-6 rounded-xl bg-brand-700 hover:bg-brand-800 active:scale-[0.99] text-white font-semibold text-sm shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer"> <span id="btnText">Emitir Invitación</span> <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg> </button> </div> </form> </main> <!-- PIE --> <footer class="max-w-xl w-full mx-auto text-center text-[11px] text-stone-400 py-4"> © 2026 Sanar es Natural • Cuarto Camino - Escuela </footer> <script> function emitirInvitacionAsegurada() { const nombre = (document.getElementById('inpNombre').value || '').trim(); const cedula = (document.getElementById('inpCedula').value || '').trim(); const telefono = (document.getElementById('inpTelefono').value || '').trim(); const correo = (document.getElementById('inpCorreo').value || '').trim(); if (!nombre || !correo) { alert("Por favor introduce el Nombre y el Correo Electrónico."); return; } const ticketNum = Math.floor(10000 + Math.random() * 90000); const ticketCode = "SEN-INV-" + ticketNum + "-X"; try { localStorage.setItem('sanar_inv_nombre', nombre); localStorage.setItem('sanar_inv_cedula', cedula); localStorage.setItem('sanar_inv_telefono', telefono); localStorage.setItem('sanar_inv_correo', correo); localStorage.setItem('sanar_inv_ticket', ticketCode); sessionStorage.setItem('sanar_inv_nombre', nombre); sessionStorage.setItem('sanar_inv_correo', correo); sessionStorage.setItem('sanar_inv_ticket', ticketCode); } catch(e) {} const params = new URLSearchParams(); params.set('ticket', ticketCode); params.set('nombre', nombre); params.set('cedula', cedula); params.set('telefono', telefono); params.set('correo', correo); const btnTxt = document.getElementById('btnText'); if (btnTxt) btnTxt.textContent = "Generando invitación..."; window.location.href = "invitacion.html?" + params.toString(); } </script> </body> </html>
